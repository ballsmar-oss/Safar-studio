# نشر النسخة الثابتة على GitHub Pages — يشتغل يدويًا من تبويب Actions.
# قبل أول تشغيل: Settings → Pages → Source = GitHub Actions
name: Deploy static site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # بدومين خاص (مثل safarstudio.sa) خلّه "/"، وبدونه يكون اسم المستودع
      - run: pnpm build:static
        env:
          STATIC_BASE: ${{ vars.STATIC_BASE || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

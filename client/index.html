<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, " />
    <meta name="theme-color" content="#f7f1e5" />
    <meta name="description" content="سَفَر — استوديو تصميم يصنع هويات وتجارب رقمية يصعب نسيانها." />
    <meta name="domain-verification" content="bd4d259ca7e05e7b2bb25455fe98824ac34354eda4e4bf3b6518bc8ad2be3537" />
    <title>سَفَر | استوديو تصميم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="site-loader" role="status" aria-live="polite" aria-label="جاري تحميل الصفحة" style="position:fixed;top:0;left:0;right:0;height:44px;z-index:9999;pointer-events:none;transition:opacity .45s ease,visibility .45s ease">
      <div style="position:absolute;left:0;right:0;bottom:0;height:6px;background:#f6e3e8;overflow:hidden">
        <span id="site-loader-bar" style="position:absolute;top:0;bottom:0;left:0;width:0;background:repeating-linear-gradient(45deg,#e7a3b5 0 6px,#f3c9d4 6px 12px);transition:width .4s ease"></span>
      </div>
      <div id="site-loader-cat" class="top-loader-cat" style="position:absolute;bottom:4px;left:0;width:38px;height:24px;transform:translateX(-30px);transition:left .4s ease"><svg viewBox="0 0 64 40" aria-hidden="true" overflow="visible" width="38" height="24"><g class="walk-legs-a"><path d="M18 28v9M40 28v9" stroke="#2b2a33" stroke-width="3.5" stroke-linecap="round"/></g><g class="walk-legs-b"><path d="M24 28v9M46 28v9" stroke="#2b2a33" stroke-width="3.5" stroke-linecap="round"/></g><path class="walk-tail" d="M50 20c8-2 10-10 6-14" fill="none" stroke="#2b2a33" stroke-width="3.5" stroke-linecap="round"/><rect x="14" y="14" width="38" height="17" rx="8.5" fill="#f6b98a" stroke="#2b2a33" stroke-width="2.5"/><path d="M6 8l2-7 6 5M20 8l-1-7-6 5" fill="#f6b98a" stroke="#2b2a33" stroke-width="2.2" stroke-linejoin="round"/><circle cx="13" cy="15" r="10" fill="#f6b98a" stroke="#2b2a33" stroke-width="2.5"/><circle cx="9.5" cy="14" r="1.8" fill="#2b2a33"/><circle cx="16" cy="14" r="1.8" fill="#2b2a33"/><ellipse cx="7.5" cy="18.5" rx="2.2" ry="1.4" fill="#f7a9b8"/><path d="M11.5 18.5l1.5 1.5 1.5-1.5" fill="none" stroke="#2b2a33" stroke-width="1.4" stroke-linecap="round"/></svg></div>
    </div>
    <style>
      .top-loader-cat { animation: cat-bounce 360ms ease-in-out infinite; }
      @keyframes cat-bounce { 50% { transform: translateY(-1.5px); } }
      .walk-legs-a, .walk-legs-b { transform-box: fill-box; transform-origin: 50% 0; animation: legs 360ms ease-in-out infinite alternate; }
      .walk-legs-b { animation-direction: alternate-reverse; }
      @keyframes legs { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
      .walk-tail { transform-box: fill-box; transform-origin: 0 100%; animation: tail 720ms ease-in-out infinite alternate; }
      @keyframes tail { to { transform: rotate(-14deg); } }
      @media (prefers-reduced-motion: reduce) { .top-loader-cat, .walk-legs-a, .walk-legs-b, .walk-tail { animation: none; } }
    </style>
    <script>
      (function () {
        var bar = document.getElementById("site-loader-bar");
        var cat = document.getElementById("site-loader-cat");
        var loader = document.getElementById("site-loader");
        var width = 0;
        function set(value) { width = value; bar.style.width = value + "%"; cat.style.left = "calc(" + value + "% - 19px)"; }
        var timer = setInterval(function () { set(Math.min(90, width + (90 - width) * 0.08 + 1)); }, 120);
        function done() {
          clearInterval(timer);
          set(100);
          setTimeout(function () { loader.style.opacity = "0"; loader.style.visibility = "hidden"; }, 350);
        }
        window.addEventListener("load", done);
        setTimeout(done, 8000);
        window.__siteLoaderDone = done;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, " />
    <meta name="theme-color" content="#f7f1e5" />
    <meta name="description" content="سَفَر — استوديو تصميم يصنع هويات وتجارب رقمية يصعب نسيانها." />
    <meta name="domain-verification" content="bd4d259ca7e05e7b2bb25455fe98824ac34354eda4e4bf3b6518bc8ad2be3537" />
    <title>سَفَر | استوديو تصميم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="site-loader" role="status" aria-live="polite" aria-label="جاري تحميل الصفحة" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fdf5e4;transition:opacity .45s ease,visibility .45s ease">
      <div style="position:relative;width:min(240px,62vw);height:70px">
        <img src="/brand/cat.png" alt="" width="64" height="64" style="position:absolute;bottom:4px;left:0;animation:loader-walk 2.4s ease-in-out infinite alternate;transform-origin:center" />
      </div>
      <div style="position:relative;width:min(240px,62vw);height:6px;border-radius:99px;background:rgba(13,43,82,.14);overflow:hidden">
        <span id="site-loader-bar" style="position:absolute;inset:0 auto 0 0;width:0;border-radius:99px;background:#e8836b;transition:width .4s ease"></span>
      </div>
    </div>
    <style>@keyframes loader-walk{from{transform:translateX(0) scaleX(1)}to{transform:translateX(176px) scaleX(1)}}</style>
    <script>
      (function () {
        var bar = document.getElementById("site-loader-bar");
        var loader = document.getElementById("site-loader");
        var width = 0;
        var timer = setInterval(function () { width = Math.min(90, width + (90 - width) * 0.08 + 1); bar.style.width = width + "%"; }, 120);
        function done() {
          clearInterval(timer);
          bar.style.width = "100%";
          setTimeout(function () { loader.style.opacity = "0"; loader.style.visibility = "hidden"; }, 250);
        }
        window.addEventListener("load", done);
        setTimeout(done, 8000);
        window.__siteLoaderDone = done;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>

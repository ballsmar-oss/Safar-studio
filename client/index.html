<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, " />
    <meta name="theme-color" content="#f7f1e5" />
    <meta name="description" content="سَفَر — استوديو تصميم يصنع هويات وتجارب رقمية يصعب نسيانها." />
    <meta name="domain-verification" content="bd4d259ca7e05e7b2bb25455fe98824ac34354eda4e4bf3b6518bc8ad2be3537" />
    <title>سَفَر | استوديو تصميم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="site-loader" role="status" aria-live="polite" aria-label="جاري تحميل الصفحة" style="position:fixed;top:0;left:0;right:0;height:64px;z-index:9999;pointer-events:none;transition:opacity .45s ease,visibility .45s ease">
      <div style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(13,43,82,.12)">
        <span id="site-loader-bar" style="position:absolute;top:0;bottom:0;left:0;width:0;background:#e8836b;transition:width .4s ease"></span>
      </div>
      <img id="site-loader-cat" src="/brand/cat.png" alt="" width="40" height="40" style="position:absolute;bottom:4px;left:0;transform:translateX(-50%);transition:left .4s ease;animation:loader-walk .5s ease-in-out infinite alternate" />
    </div>
    <style>@keyframes loader-walk{from{transform:translateX(-50%) translateY(0)}to{transform:translateX(-50%) translateY(-5px)}}</style>
    <script>
      (function () {
        var bar = document.getElementById("site-loader-bar");
        var cat = document.getElementById("site-loader-cat");
        var loader = document.getElementById("site-loader");
        var width = 0;
        function set(value) { width = value; bar.style.width = value + "%"; cat.style.left = value + "%"; }
        var timer = setInterval(function () { set(Math.min(90, width + (90 - width) * 0.08 + 1)); }, 120);
        function done() {
          clearInterval(timer);
          set(100);
          setTimeout(function () { loader.style.opacity = "0"; loader.style.visibility = "hidden"; }, 350);
        }
        window.addEventListener("load", done);
        setTimeout(done, 8000);
        window.__siteLoaderDone = done;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>

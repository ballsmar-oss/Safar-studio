<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <g stroke="#0a1a36" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail: rises from the back and curls at the top -->
    <path d="M84 118 C104 116 110 96 104 78 C101 68 92 66 92 74 C96 84 94 100 80 104 Z" fill="#fdae4d"/>
    <!-- body: upright, a little wider at the base -->
    <path d="M40 60 C30 78 30 104 34 128 L80 128 C84 104 84 78 74 60 Z" fill="#fdf4dd"/>
    <!-- orange patch on the back -->
    <path d="M44 74 C52 68 66 70 70 80 C72 90 62 96 56 92 C48 88 40 84 44 74 Z" fill="#fdae4d" stroke="none"/>
    <!-- front legs -->
    <path d="M46 124 L46 142 L58 142 L58 124" fill="#fdf4dd"/>
    <path d="M64 124 L64 142 L76 142 L76 124" fill="#fdf4dd"/>
    <!-- head -->
    <path d="M30 38 C30 24 40 18 54 18 C68 18 78 24 78 38 C78 52 68 60 54 60 C40 60 30 52 30 38 Z" fill="#fdf4dd"/>
    <!-- ears -->
    <path d="M32 30 L30 8 L48 20 Z" fill="#fdf4dd"/>
    <path d="M76 30 L78 8 L60 20 Z" fill="#fdf4dd"/>
    <!-- head patch -->
    <path d="M40 30 C44 22 52 24 52 30 C52 36 42 38 40 30 Z" fill="#fdae4d" stroke="none"/>
  </g>
  <!-- closed eyes and nose -->
  <g stroke="#0a1a36" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M42 40 Q46 44 50 40"/>
    <path d="M58 40 Q62 44 66 40"/>
  </g>
  <path d="M53 46 L57 46 L55 48.5 Z" fill="#f08a8a" stroke="#0a1a36" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
